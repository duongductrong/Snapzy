name: CI Build Check

on:
  push:
    branches: [master, beta]
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '**/*.md'
  pull_request:
    branches: [master, beta]
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Reset SwiftPM artifact cache
        # Fresh macos-15 images can ship a stale entry for the Sparkle binary
        # artifact, which makes package resolution fail with
        # "... already exists in file system".
        run: rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"

      - name: Verify localization catalogs
        run: |
          set -euo pipefail
          mkdir -p build/swift-module-cache
          swift -module-cache-path build/swift-module-cache tools/localization/CatalogTool.swift verify

      - name: Test SnapzyCLIKit package
        run: swift test --package-path Packages/SnapzyCLIKit

  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Reset SwiftPM artifact cache
        # Fresh macos-15 images can ship a stale entry for the Sparkle binary
        # artifact, which makes package resolution fail with
        # "... already exists in file system".
        run: rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"

      - name: Run tests
        env:
          # The following tests crash on GitHub Actions macOS runners (Swift concurrency /
          # headless CGS), so they are skipped in CI and run locally instead.
          # The timeline suites also abort intermittently on the headless runner with a
          # malloc error; they remain covered by local CI.
          # The #690 tap regression tests that drive a real overlay session or spin the main
          # run loop across threads can hang the headless runner; they also run locally.
          SNAPZY_CI_SKIP_TESTS: |
            SnapzyTests/GoogleDriveTests
            SnapzyTests/DatabaseManagerTests
            SnapzyTests/QuickAccessCoreTests/testQuickAccessCountdownTimer_pauseResumePreservesRemainingTime
            SnapzyTests/QuickAccessCoreTests/testQuickAccessCountdownTimer_cancelPreventsExpiration
            SnapzyTests/QuickAccessCoreTests/testQuickAccessTrackpadSwipeModeStore_persistsMode
            SnapzyTests/QuickAccessCoreTests/testQuickAccessTrackpadSwipeModeStore_resetToDefault
            SnapzyTests/OCRRecognitionTests
            SnapzyTests/CustomOCRModelStoreTests
            SnapzyTests/OCRModelSelectionTests
            SnapzyTests/PreferencesOCRModelSelectionTests
            SnapzyTests/OCRKeychainStoreTests
            SnapzyTests/RemoteOCRServiceTests
            SnapzyTests/SmartElementCaptureControllerTests
            SnapzyTests/SmartElementWindowOwnerResolverTests
            SnapzyTests/SmartElementQueryServiceTests
            SnapzyTests/ColorPickerSessionTests
            SnapzyTests/ScreenRulerSessionTests
            SnapzyTests/SandboxOffDataMigrationServiceTests
            SnapzyTests/AppStatusBarControllerTests
            SnapzyTests/RecordingAudioLevelMeterTests
            SnapzyTests/RecordingToolbarInteractionTests/testRecordButton_dispatchesFromPaddedSurface
            SnapzyTests/RecordingToolbarWindowTests/testShowRecordingStatusBar_alreadyVisibleWindow_enablesBackgroundDragging
            SnapzyTests/RecordingToolbarWindowTests/testShowRecordingStatusBar_reportsAnnotateButtonCenterInHostingWindow
            SnapzyTests/RecordingToolbarWindowTests/testAnnotationPopover_centersOnReportedAnnotateButton
            SnapzyTests/S3MultipartUploaderTests/testMultipartUpload_abortsOnFailure
            SnapzyTests/CaptureViewModelTests/testHiddenWindowSession_restore_postsSyntheticMouseMovedEvent
            SnapzyTests/AnnotateCreationTests/testCanExtractTextRequiresNormalAnnotateSourceImage
            SnapzyTests/AnnotateExportSaveTests/testCopyToClipboardRunsWithoutCrashing
            SnapzyTests/AnnotateExportSaveTests/testSaveAsIsCoveredByManualInteractionOnly
            SnapzyTests/AnnotateBackgroundRedactionTests/testApplyBackgroundCutoutStartsProcessingOnSupportedOS
            SnapzyTests/AnnotateBackgroundRedactionTests/testAutoRedactSensitiveDataStartsScan
            SnapzyTests/AnnotateMockupTests/testMockupExporterRenderProducesImageWithSourceImage
            SnapzyTests/AnnotateTextSnappingTests/testDetectorReportsTextNearTheImageTopWithAHighY
            SnapzyTests/AnnotateBlurCacheManagerTests/testGetCachedBlur_nonBlockingSchedulesRender
            SnapzyTests/InlineAreaAnnotateSessionTests/testAnnotateWindowConsumesCopyAndDuplicateWhenNothingIsSelected
            SnapzyTests/InlineAreaAnnotateSessionTests/testUpdateSelectionPublishesPointerLocation
            SnapzyTests/InlineAreaAnnotateSessionTests/testEndSelectionClearsPointerLocation
            SnapzyTests/InlineAreaAnnotateSessionTests/testPointerTrackingTickPublishesPointerWithoutHoverEvents
            SnapzyTests/InlineAreaAnnotateSessionTests/testPointerTrackingTickFillsInStalledDrag
            SnapzyTests/InlineAreaAnnotateSessionTests/testPointerTrackingTickIsInertAfterSelectingPhase
            SnapzyTests/AreaSelectionMultiMonitorReconciliationTests
            SnapzyTests/AreaSelectionSessionLifecycleTests
            SnapzyTests/AreaSelectionHoverPerformanceTests
            SnapzyTests/AreaSelectionControllerTests
            SnapzyTests/AreaSelectionModelsTests
            SnapzyTests/AreaSelectionOverlayPassthroughStaleLocationTests
            SnapzyTests/AreaSelectionLivePassthroughWindowDetectionTests
            SnapzyTests/AreaSelectionOverlayMagnifierLayoutTests/testMagnifierZoom_worksWithEmptyBackdropsInitially
            SnapzyTests/PersistedCombineSessionTests/testCaptureStitchSaveReopen_persistsStitchEverywhere
            SnapzyTests/BackgroundCursorControlTests
            SnapzyTests/LivePassthroughInputLogicTests
            SnapzyTests/HotkeyUnregistrationTests
            SnapzyTests/RecordingSessionShortcutGatingTests
            SnapzyTests/RecordingSessionHotkeyRegistrationTests
            SnapzyTests/SnapzyOnboardingStateTests/testStep2ScreenRecordingWorkflow
            SnapzyTests/VideoEditorSessionStoreTests/testEditorHostingReplay_preservesFinalZoomAndSpeedValues
            SnapzyTests/VideoEditorSessionStoreTests/testAIPanelOpen_withLeftSidebar_keepsWindowWidth
            SnapzyTests/VideoEditorTimelineViewportTests
            SnapzyTests/VideoEditorTimelineScrollCatcherTests
            SnapzyTests/Issue690InputLockRegressionTests
            SnapzyTests/CaptureEventTapControllerTests/testHandleTapEvent_tapDisabledByTimeout_staysDisabledAndEndsSession
            SnapzyTests/CaptureEventTapControllerTests/testSessionDeadline_disablesTapOffMainThenEndsSession
            SnapzyTests/CaptureEventTapControllerTests/testStaleSessionDeadline_doesNotEndNextSession
        run: |
          set -euo pipefail
          mkdir -p build
          rm -rf build/ci-test.xcresult
          test_args=()
          if [[ -n "${SNAPZY_CI_SKIP_TESTS:-}" ]]; then
            skip_tests="${SNAPZY_CI_SKIP_TESTS//$'\n'/ }"
            skip_tests="${skip_tests//,/ }"
            skip_tests="${skip_tests//;/ }"
            echo "Skipping XCTest identifiers from SNAPZY_CI_SKIP_TESTS:"
            for test_id in $skip_tests; do
              [[ -z "$test_id" ]] && continue
              echo "  - $test_id"
              test_args+=("-skip-testing:$test_id")
            done
          fi

          if ! xcodebuild \
            -project Snapzy.xcodeproj \
            -scheme Snapzy \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ci-test.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            "${test_args[@]}" \
            test > build/ci-test.log 2>&1; then
            echo "::group::Likely test failures"
            grep -E "Test [Cc]ase '.*' (failed|skipped)|Test crashed|malloc:|Failing tests:|\\*\\* TEST FAILED \\*\\*|error:" build/ci-test.log || true
            echo "::endgroup::"
            tail -200 build/ci-test.log
            exit 1
          fi

          tail -20 build/ci-test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-diagnostics
          path: |
            build/ci-test.log
            build/ci-test.xcresult

  release-build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Pull requests build arm64 only to keep the Release (WMO) compile short; the
      # SIL optimizer is arch-independent, so optimizer crashes still surface.
      # Pushes to master/beta build universal exactly like release-publish.yml.
      BUILD_MODE: ${{ github.event_name == 'pull_request' && 'arm64' || 'universal' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Reset SwiftPM artifact cache
        # Fresh macos-15 images can ship a stale entry for the Sparkle binary
        # artifact, which makes package resolution fail with
        # "... already exists in file system".
        run: rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"

      - name: Build Release
        run: |
          set -euo pipefail
          mkdir -p build

          if [ "$BUILD_MODE" = "universal" ]; then
            arch_args=(ONLY_ACTIVE_ARCH=NO)
          else
            arch_args=(ARCHS=arm64 ONLY_ACTIVE_ARCH=YES)
          fi
          echo "Build mode: $BUILD_MODE (${arch_args[*]})"

          start=$(date +%s)
          set +e
          xcodebuild \
            -project Snapzy.xcodeproj \
            -scheme Snapzy \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            "${arch_args[@]}" \
            build > build/ci-build.log 2>&1
          status=$?
          set -e
          elapsed=$(( $(date +%s) - start ))

          {
            echo "### Release build ($BUILD_MODE)"
            echo ""
            echo "| Result | Duration |"
            echo "| --- | --- |"
            if [ "$status" -eq 0 ]; then result="success"; else result="failed ($status)"; fi
            printf '| %s | %dm %02ds |\n' "$result" $((elapsed / 60)) $((elapsed % 60))
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            tail -100 build/ci-build.log
            exit 1
          fi

          tail -20 build/ci-build.log

      - name: Verify app bundle
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Snapzy.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Snapzy.app not found at expected path"
            exit 1
          fi
          echo "Build successful: $APP_PATH"

          CLI_HELPER="$APP_PATH/Contents/Helpers/snapzy"
          if [ ! -x "$CLI_HELPER" ]; then
            echo "::error::snapzy command line tool not embedded at $CLI_HELPER"
            exit 1
          fi
          # With no app running and --no-launch the CLI must fail cleanly (exit 5), not crash.
          set +e
          SNAPZY_SOCKET="$RUNNER_TEMP/snapzy-ci.sock" "$CLI_HELPER" version --no-launch
          CLI_EXIT=$?
          set -e
          if [ "$CLI_EXIT" -ne 5 ]; then
            echo "::error::snapzy version --no-launch exited $CLI_EXIT, expected 5"
            exit 1
          fi
          echo "Embedded snapzy CLI verified"

      # Release-only crash class (#725): optimized builds call macOS 15+ Swift
      # runtime symbols without a fallback, so the app dies at launch on 13/14.
      # Same guard as release-publish.yml, so a green PR cannot fail the release.
      - name: Guard Swift runtime imports for deployment target
        run: |
          set -euo pipefail
          bash scripts/check-runtime-weak-imports.sh build/DerivedData/Build/Products/Release/Snapzy.app

      - name: Verify universal binaries
        if: env.BUILD_MODE == 'universal'
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/Snapzy.app"
          APP_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")
          for bin in "$APP_PATH/Contents/MacOS/$APP_EXEC" "$APP_PATH/Contents/Helpers/snapzy"; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            for want in x86_64 arm64; do
              if ! grep -qw "$want" <<<"$archs"; then
                echo "::error::$bin is missing $want (has: $archs)"
                exit 1
              fi
            done
          done
