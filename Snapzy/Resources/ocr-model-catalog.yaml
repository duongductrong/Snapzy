# Snapzy ships with an empty downloadable OCR model catalog.
#
# No third-party OCR weights are bundled, referenced, or downloaded by default.
# The built-in on-device engine (Apple Vision) is the only OCR engine available
# out of the box.
#
# To use a downloadable OCR model, add it yourself:
#   Settings -> Capture -> OCR -> Add -> Downloadable model
#   Settings -> Capture -> OCR -> Import  (a JSON/YAML manifest in this format)
#   ~/.config/snapzy/config.toml -> capture.ocr.catalog_models
#
# You are responsible for the license and terms of any model you add.
#
# Manifest format (this file, or any file you import):
#
#   format: snapzy-ocr-catalog     # or snapzy-ocr-model for a single `model:`
#   schema_version: 1
#   models:                        # max 100 entries
#     - id: my-model               # 1-64 chars, [a-z0-9] then [a-z0-9._-]
#       display_name: My Model     # 1-100 chars
#       parameter_count_label: 8M  # 1-100 chars, shown in Settings
#       fp32_size_label: 30 MB     # 1-100 chars, shown in Settings
#       int8_size_label: 9 MB      # 1-100 chars, shown in Settings
#       adapter: ppocr-db-ctc-v1   # only supported adapter today
#       artifacts:                 # exactly one of each role
#         - role: detector         # installed as det.onnx
#           source:
#             type: url            # HTTPS only, no credentials in the URL
#             url: "https://example.com/det.onnx"
#           expected_bytes: 9880512      # required for detector/recognizer, <= 8 GB
#           sha256: "<64 lowercase hex>" # required for detector/recognizer
#         - role: recognizer       # installed as rec.onnx
#           source:
#             type: hugging_face   # or type: url
#             repository: owner/repo
#             revision: main
#             file: inference.onnx
#           expected_bytes: 21159378
#           sha256: "<64 lowercase hex>"
#         - role: dictionary       # installed as dict.txt, >= 100 non-empty lines
#           source:
#             type: url
#             url: "https://example.com/dict.txt"
#
# Downloads are verified against expected_bytes and sha256 before install.
# YAML anchors, aliases, merge keys, custom tags, and unknown keys are rejected.

format: snapzy-ocr-catalog
schema_version: 1
models: []
